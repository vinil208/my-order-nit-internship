services:
  factory:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - factory-data:/app/data
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-lookup}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:0.6b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-terra}
    restart: unless-stopped
volumes:
  factory-data:
